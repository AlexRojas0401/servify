services:
  postgres:
    image: postgres:17
    container_name: servify-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: servify
      POSTGRES_USER: servify
      POSTGRES_PASSWORD: servify123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
